name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag version to release (e.g. v1.0.4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate integration with HACS & Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"

      - name: Hassfest
        uses: "home-assistant/actions/hassfest@master"

  release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes from Commit History
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -n 1 || true)
          echo "## What's Changed in ${TAG}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..${TAG}" --pretty=format:"* %s (\`%h\`)" --grep="^chore(release):" --invert-grep >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> RELEASE_NOTES.md
          else
            git log "${TAG}" --pretty=format:"* %s (\`%h\`)" >> RELEASE_NOTES.md
          fi

      - name: Package integration zip for HACS
        run: |
          cd custom_components
          zip -r ../thermor_onix_custom.zip thermor_onix_custom
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          draft: false
          prerelease: false
          files: |
            thermor_onix_custom.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
